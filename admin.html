<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月餅訂單彙總</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: '"Noto Sans TC"', system-ui, sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .print-block { break-inside: avoid; }
    }
  </style>
</head>
<body class="min-h-screen bg-stone-100 text-stone-800">
  <div class="mx-auto max-w-4xl px-4 py-8">

    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <h1 class="text-2xl font-bold">🥮 月餅訂單彙總 / 製作單</h1>
      <a href="index.html" class="no-print text-sm text-amber-700 hover:underline">← 回訂購頁</a>
    </header>

    <!-- 控制列 -->
    <div class="no-print bg-white rounded-xl ring-1 ring-stone-200 p-4 mb-6 grid gap-3 sm:grid-cols-[1fr_auto_auto_auto] sm:items-end">
      <label class="block">
        <span class="text-xs font-semibold text-stone-500">管理金鑰</span>
        <input id="keyInput" type="password" placeholder="ADMIN_KEY"
          class="mt-1 w-full rounded-lg border-stone-300 focus:border-amber-500 focus:ring-amber-500" />
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-stone-500">取貨日期</span>
        <input id="dateInput" type="date"
          class="mt-1 rounded-lg border-stone-300 focus:border-amber-500 focus:ring-amber-500" />
      </label>
      <button id="loadBtn"
        class="rounded-lg bg-amber-600 px-5 py-2 text-white font-semibold hover:bg-amber-700">載入</button>
      <button id="printBtn"
        class="rounded-lg ring-1 ring-stone-300 px-4 py-2 font-semibold hover:bg-stone-50">列印</button>
    </div>

    <p id="msg" class="text-sm text-stone-500 mb-4">輸入管理金鑰後按「載入」。留空取貨日期＝全部訂單。</p>

    <div id="report" class="hidden space-y-8">
      <!-- 製作彙總 -->
      <section class="print-block bg-white rounded-xl ring-1 ring-stone-200 p-5">
        <h2 class="text-lg font-bold mb-1">製作彙總</h2>
        <p id="reportScope" class="text-xs text-stone-500 mb-4"></p>
        <div class="overflow-x-auto">
          <table class="w-full text-sm border-collapse" id="matrixTable"></table>
        </div>
      </section>

      <!-- 分類小計 -->
      <section class="print-block grid sm:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl ring-1 ring-stone-200 p-5">
          <h3 class="font-bold mb-3">依內餡</h3>
          <table class="w-full text-sm" id="fillingTable"></table>
        </div>
        <div class="bg-white rounded-xl ring-1 ring-stone-200 p-5">
          <h3 class="font-bold mb-3">依加料</h3>
          <table class="w-full text-sm" id="toppingTable"></table>
        </div>
        <div class="bg-white rounded-xl ring-1 ring-stone-200 p-5">
          <h3 class="font-bold mb-3">依顆數</h3>
          <table class="w-full text-sm" id="packTable"></table>
        </div>
      </section>

      <!-- 訂單清單 -->
      <section class="print-block bg-white rounded-xl ring-1 ring-stone-200 p-5">
        <h2 class="text-lg font-bold mb-4">訂單清單（<span id="orderCount">0</span> 筆）</h2>
        <div id="orderList" class="space-y-4"></div>
      </section>
    </div>
  </div>

  <script src="config.js?v=20260828-3"></script>
  <script src="admin.js?v=20260828-3"></script>
</body>
</html>
